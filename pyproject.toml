[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foctwin"
version = "0.3.6"
description = "Motor identification, Simulink digital twin and SimpleFOC autotuning workstation"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "PySide6>=6.5,<6.9",
  "pyqtgraph>=0.13,<0.14",
  "pyserial>=3.5,<4",
  "numpy>=1.24,<2.1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
  "pyinstaller>=6,<7",
]

[project.scripts]
foctwin = "foctwin.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foctwin = ["resources/*.png", "resources/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"
